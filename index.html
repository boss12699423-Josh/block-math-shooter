<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>方塊算術槍戰 3D</title>
<style>
:root{--ink:#fff;--acc:#ffd23f;--bad:#ff5d73;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:#87ceeb;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
*{box-sizing:border-box}
canvas#v{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;pointer-events:none;text-shadow:0 2px 0 #000a}
.q{font-size:clamp(26px,5vw,44px);font-weight:800;color:var(--acc);background:#000a;padding:6px 22px;border:3px solid #fff;border-radius:4px}
.st{display:flex;gap:22px;font-size:18px;font-weight:700}
.x{position:fixed;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%);pointer-events:none}
.x:before,.x:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
.x:before{left:12px;top:0;width:2px;height:26px}.x:after{top:12px;left:0;height:2px;width:26px}
.ov{overflow:auto;position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:16px;background:#000b;text-align:center;font-size:20px;line-height:1.7;padding:20px}
.ov.hide{display:none}
button{font:inherit;font-size:20px;font-weight:800;border:3px solid #fff;border-radius:4px;background:#4a8f2c;color:#fff;padding:10px 30px;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tc{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:14px;right:14px;display:none;justify-content:space-between;align-items:flex-end}
.tc .d{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,52px);gap:5px}
.tc .d button{padding:0;font-size:20px;opacity:.8}.tc .u{grid-column:2}.tc .l{grid-row:2}.tc .b{grid-row:2}.tc .r{grid-row:2}
.tc .f{width:92px;height:92px;border-radius:50%;background:var(--bad);opacity:.85}
@media(pointer:coarse){.tc{display:flex}}
fieldset{border:2px solid #fff6;border-radius:6px;margin:0;padding:6px 12px;font-size:17px}legend{padding:0 6px;color:var(--acc)}
fieldset label,.row label{display:inline-block;margin:3px 8px;cursor:pointer}select{font:inherit;font-size:16px;padding:2px 6px}
#cfg{display:flex;flex-direction:column;gap:10px;max-width:520px}.ov>*{flex-shrink:0}
#bn{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:clamp(28px,6vw,54px);font-weight:800;color:#fff;text-shadow:0 3px 0 #000;pointer-events:none;opacity:0;transition:opacity .6s}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .25s}
</style>
</head>
<body>
<canvas id="v"></canvas>
<div id="flash"></div><div id="bn"></div>
<div class="hud"><div class="q" id="q">—</div><div class="st"><span>關卡 <b id="lv">1</b></span><span>分數 <b id="sc">0</b></span><span id="hp">❤❤❤</span></div></div>
<div class="x"></div>
<div class="tc"><div class="d"><button class="u" data-k="w">▲</button><button class="l" data-k="a">◀</button><button class="b" data-k="s">▼</button><button class="r" data-k="d">▶</button></div><button class="f" id="tf">射擊</button></div>
<div class="ov" id="ov"><div id="msg">找出頭上數字等於題目答案的方塊怪物，只射它就能過關！<br>過完全部關卡後，迎戰最終魔王。<br><small>怪物會主動攻擊：射錯扣 10 血，過關回 20 血<br>WASD 移動、滑鼠瞄準、左鍵射擊（Esc 暫停）｜手機：拖曳轉向，按鈕移動與射擊</small></div>
<div id="cfg"><fieldset><legend>學生資料（會顯示在過關畫面）</legend><label>班級 <input id="cls" maxlength="12" size="8" autocomplete="off"></label><label>姓名 <input id="nm" maxlength="12" size="8" autocomplete="off"></label></fieldset>
<fieldset><legend>單元（可複選）</legend><label><input type="checkbox" name="u" value="addsub" checked> 整數加減</label><label><input type="checkbox" name="u" value="muldiv" checked> 整數乘除</label><label><input type="checkbox" name="u" value="mixed" checked> 四則運算</label><label><input type="checkbox" name="u" value="abs" checked> 絕對值</label><label><input type="checkbox" name="u" value="opp" checked> 相反數</label></fieldset>
<fieldset><legend>難易度</legend><label><input type="radio" name="d" value="easy"> 易（怪物慢、直線追擊）</label><label><input type="radio" name="d" value="mid" checked> 中（較快、部分包夾）</label><label><input type="radio" name="d" value="hard"> 難（很快、四面包夾）</label></fieldset>
<div class="row"><label>關卡數 <select id="nl"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></label><label>魔王血量（攻擊次數） <select id="nb"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></label></div>
</div><button id="go">開始</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=i=>document.getElementById(i),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),F=(a,b)=>a+Math.random()*(b-a);
const cv=$('v'),ren=new THREE.WebGLRenderer({canvas:cv,antialias:false});
ren.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);scene.fog=new THREE.Fog(0x87ceeb,25,70);
const cam=new THREE.PerspectiveCamera(70,1,.1,100);cam.rotation.order='YXZ';cam.position.set(0,1.6,0);scene.add(cam);

const sun=new THREE.DirectionalLight(0xffffff,.6);sun.position.set(10,20,5);scene.add(sun);
function resize(){ren.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const LIM=30,mat=c=>new THREE.MeshLambertMaterial({color:c});
const box=(w,h,d,c,x=0,y=0,z=0)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);return m};
// 關卡場景
const hemi=new THREE.HemisphereLight(0xffffff,0x6a8f4a,.9);scene.add(hemi);
const TH=[
{n:'草原',sky:0x87ceeb,fog:[25,70],hue:100,sat:45,lig:36,hl:0x6a8f4a,hi:.9,deco:'oak'},
{n:'沙漠',sky:0xf0d9a8,fog:[30,80],hue:42,sat:55,lig:62,hl:0xc9a35a,hi:1,deco:'cactus'},
{n:'雪原',sky:0xcfe3f2,fog:[18,55],hue:200,sat:30,lig:88,hl:0xaac4dc,hi:1,deco:'spruce'},
{n:'地獄',sky:0x3a0a0a,fog:[12,45],hue:0,sat:55,lig:22,hl:0x802010,hi:.95,deco:'nether'},
{n:'終界',sky:0x0c0818,fog:[15,50],hue:55,sat:25,lig:60,hl:0x6040a0,hi:.85,deco:'end'}];
const bb=(w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshBasicMaterial({color:c}));m.position.set(x,y,z);return m};
let env=null;
function buildScene(th){
 if(env){scene.remove(env);env.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){o.material.map&&o.material.map.dispose();o.material.dispose()}})}
 env=new THREE.Group();scene.add(env);
 scene.background=new THREE.Color(th.sky);scene.fog=new THREE.Fog(th.sky,th.fog[0],th.fog[1]);hemi.groundColor.set(th.hl);hemi.intensity=th.hi;
 const t=document.createElement('canvas');t.width=t.height=16;const c=t.getContext('2d');
 for(let x=0;x<16;x++)for(let y=0;y<16;y++){c.fillStyle=`hsl(${th.hue+R(-6,6)},${th.sat+R(0,15)}%,${th.lig+R(-5,7)}%)`;c.fillRect(x,y,1,1)}
 const tx=new THREE.CanvasTexture(t);tx.magFilter=THREE.NearestFilter;tx.wrapS=tx.wrapT=THREE.RepeatWrapping;tx.repeat.set(LIM*2,LIM*2);
 const f=new THREE.Mesh(new THREE.PlaneGeometry(LIM*2+10,LIM*2+10),new THREE.MeshLambertMaterial({map:tx}));f.rotation.x=-Math.PI/2;env.add(f);
 for(let i=0;i<46;i++){const a=F(0,6.28),r=F(8,LIM+4),x=Math.cos(a)*r,z=Math.sin(a)*r,h=R(3,5),d=th.deco;
  if(d==='oak'){if(Math.random()<.6){env.add(box(.8,h,.8,0x6b4a2b,x,h/2,z),box(3,2,3,0x2f7d32,x,h+.5,z),box(2,1,2,0x3a9a3e,x,h+1.8,z))}else env.add(box(R(1,2),R(1,2),R(1,2),0x8a8a8a,x,.7,z))}
  else if(d==='cactus'){if(Math.random()<.6){env.add(box(.7,h,.7,0x3a8a3a,x,h/2,z),box(.5,.5,1,0x3a8a3a,x+.6,h*.6,z))}else env.add(box(R(1,2),R(1,2),R(1,2),0xd9c58b,x,.7,z))}
  else if(d==='spruce'){if(Math.random()<.65){env.add(box(.7,2,.7,0x5a3d22,x,1,z),box(3,1.2,3,0x1f5a3a,x,2.6,z),box(2.2,1.2,2.2,0x246b44,x,3.7,z),box(1.2,1,1.2,0xffffff,x,4.7,z))}else env.add(box(R(1,2),R(1,2),R(1,2),0xa5d8f0,x,.7,z))}
  else if(d==='nether'){if(Math.random()<.6){env.add(box(1,h+2,1,0x4a1a1a,x,(h+2)/2,z),bb(1.1,.5,1.1,0xffd070,x,h+2.2,z))}else env.add(bb(R(2,4),.2,R(2,4),0xff6a00,x,.1,z))}
  else{env.add(box(1.2,h+4,1.2,0x15101f,x,(h+4)/2,z),bb(1.4,.4,1.4,0xb050ff,x,h+4.2,z))}}}
let bnT;function banner(s){const e=$('bn');e.textContent=s;e.style.opacity=1;clearTimeout(bnT);bnT=setTimeout(()=>e.style.opacity=0,2200)}
buildScene(TH[0]);

// 方塊人物（像素風）
function skin(c1,c2){const t=document.createElement('canvas');t.width=t.height=8;const c=t.getContext('2d');
 for(let x=0;x<8;x++)for(let y=0;y<8;y++){c.fillStyle=c1;c.fillRect(x,y,1,1);if(Math.random()<.3){c.fillStyle=c2;c.fillRect(x,y,1,1)}}
 const tx=new THREE.CanvasTexture(t);tx.magFilter=THREE.NearestFilter;return new THREE.MeshLambertMaterial({map:tx})}
const KINDS=['zombie','skeleton','creeper','enderman','spider','slime'];
const SH=[['#2fb3b3','#27a0a0'],['#b33f9a','#9a2f85'],['#c9a227','#b38f1c'],['#d1503a','#b8412d'],['#5a67d8','#4a56c0']];
function ft(bg,fn){const t=document.createElement('canvas');t.width=t.height=8;const c=t.getContext('2d');c.fillStyle=bg;c.fillRect(0,0,8,8);fn(c);const x=new THREE.CanvasTexture(t);x.magFilter=THREE.NearestFilter;return new THREE.MeshLambertMaterial({map:x})}
const pr=(c,col,...r)=>{c.fillStyle=col;for(let i=0;i<r.length;i+=4)c.fillRect(r[i],r[i+1],r[i+2],r[i+3])};
function label(n,y){const t=document.createElement('canvas');t.width=128;t.height=64;const c=t.getContext('2d');
 c.fillStyle='#fff';c.fillRect(0,0,128,64);c.strokeStyle='#222';c.lineWidth=6;c.strokeRect(3,3,122,58);
 c.fillStyle='#111';c.font='bold 42px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(n,64,34);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(t),depthTest:false}));s.scale.set(1.6,.8,1);s.renderOrder=9;s.position.y=y;return s}
function mk(v,kind){
 const k=kind||KINDS[R(0,KINDS.length-1)],g=new THREE.Group(),limbs=[];let ly=3.0,spm=1;
 const head=(w,sk,fm,y)=>{const h=new THREE.Mesh(new THREE.BoxGeometry(w,w,w),[sk,sk,sk,sk,fm,sk]);h.position.y=y;g.add(h)};
 const torso=(w,h,d,m,y)=>{const t=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);t.position.y=y;g.add(t)};
 const L=(x,m,h,y,w=.38,z=0,b=0,a=.6,ph=0,ax='x')=>{const p=new THREE.Group();p.position.set(x,y,z);const q=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),m);q.position.y=-h/2;p.add(q);p.rotation[ax]=b;g.add(p);limbs.push({p,b,a,ph,ax})};
 const AB=-Math.PI/2.2;
 if(k==='boss'){
  const sk=mat(0xe8c9a8),rd=mat(0xb5301f),sA=mat(0xc62828),sB=mat(0xf2f2f2),ov=mat(0x2a4fa0),bk=mat(0x111111),wh=mat(0xffffff),bl=mat(0x2a6fd6),sc=mat(0x7a1010);
  const P=(w,h,d,m,x,y,z)=>{const e=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);e.position.set(x,y,z);g.add(e);return e};
  P(.9,.9,.9,sk,0,2.1,0);P(1,.3,1,rd,0,2.65,0);P(.15,.7,1,rd,-.5,2.3,0);P(.15,.7,1,rd,.5,2.3,0);P(1,.7,.15,rd,0,2.3,-.5);P(.3,.25,.1,rd,0,2.45,.5);
  P(.22,.2,.05,bl,-.22,2.2,.46);P(.22,.2,.05,bl,.22,2.2,.46);P(.09,.09,.06,bk,-.22,2.2,.48);P(.09,.09,.06,bk,.22,2.2,.48);
  P(.34,.07,.05,bk,-.22,2.4,.47).rotation.z=-.4;P(.34,.07,.05,bk,.22,2.4,.47).rotation.z=.4;
  P(.55,.13,.05,bk,0,1.8,.47);P(.45,.05,.06,wh,0,1.86,.48);P(.3,.05,.06,sc,.2,2.0,.47);[-.1,0,.1].forEach(x=>P(.03,.14,.06,sc,.2+x,2.0,.475));
  for(let i=0;i<3;i++)P(.8,.2,.4,i%2?sB:sA,0,1.5-i*.2,0);P(.82,.5,.42,ov,0,.85,0);P(.12,.7,.44,ov,-.25,1.3,0);P(.12,.7,.44,ov,.25,1.3,0);
  L(-.6,sk,1.0,1.55,.3,0,-Math.PI/2.2,.15,0);L(.6,sk,1.0,1.55,.3,0,-Math.PI/2.0,.15,Math.PI);
  limbs[limbs.length-1].p.add((()=>{const kn=new THREE.Mesh(new THREE.BoxGeometry(.08,.8,.08),mat(0xdddddd));kn.position.y=-1.35;return kn})());
  L(-.2,ov,.6,.6,.3,0,0,.5,0);L(.2,ov,.6,.6,.3,0,0,.5,Math.PI);
  g.scale.setScalar(1.7)}
 else if(k==='zombie'){const s=SH[R(0,SH.length-1)],sk=skin('#4e9a3a','#448a33');
  head(.8,sk,ft('#4e9a3a',c=>pr(c,'#000',1,3,2,2,5,3,2,2,3,5,2,2)),2.0);torso(.8,1.2,.4,skin(s[0],s[1]),1.0);
  const lg=skin('#3a47a8','#2f3b92');L(-.6,sk,1.1,1.55,.38,0,AB,.18,0);L(.6,sk,1.1,1.55,.38,0,AB,.18,Math.PI);L(-.2,lg,.8,.8,.38,0,0,.6,0);L(.2,lg,.8,.8,.38,0,0,.6,Math.PI)}
 else if(k==='skeleton'){const sk=skin('#dcdcdc','#bdbdbd');
  head(.8,sk,ft('#d6d6d6',c=>pr(c,'#222',1,3,2,2,5,3,2,2,3,5,2,1)),2.0);torso(.7,1.2,.3,skin('#cfcfcf','#a8a8a8'),1.0);
  L(-.5,sk,1.1,1.55,.22,0,AB,.15,0);L(.5,sk,1.1,1.55,.22,0,AB,.15,Math.PI);L(-.18,sk,.8,.8,.22,0,0,.6,0);L(.18,sk,.8,.8,.22,0,0,.6,Math.PI)}
 else if(k==='creeper'){const sk=skin('#5fb04a','#3f8a34');
  head(.8,sk,ft('#5fb04a',c=>pr(c,'#111',1,2,2,2,5,2,2,2,3,4,2,2,2,5,1,2,5,5,1,2)),1.9);torso(.8,1.0,.5,sk,1.0);
  ly=2.9;spm=.8;[[-.2,-.25],[.2,-.25],[-.2,.25],[.2,.25]].forEach(([x,z],i)=>L(x,sk,.5,.5,.38,z,0,.4,i%3?Math.PI:0))}
 else if(k==='enderman'){const sk=skin('#1a1a1a','#0d0d0d');
  head(.7,sk,ft('#1a1a1a',c=>pr(c,'#e070ff',0,3,3,1,5,3,3,1)),2.95);torso(.7,1.0,.3,sk,2.1);
  L(-.45,sk,1.6,2.55,.15,0,0,.3,0);L(.45,sk,1.6,2.55,.15,0,0,.3,Math.PI);L(-.15,sk,1.6,1.6,.2,0,0,.4,0);L(.15,sk,1.6,1.6,.2,0,0,.4,Math.PI);
  ly=3.9;spm=1.2}
 else if(k==='spider'){const sk=skin('#3a2f2f','#2a2020');
  const h=new THREE.Mesh(new THREE.BoxGeometry(.6,.6,.6),[sk,sk,sk,sk,ft('#3a2f2f',c=>pr(c,'#ff2a2a',1,2,1,1,2,2,1,1,5,2,1,1,6,2,1,1)),sk]);h.position.set(0,.55,.7);g.add(h);
  const ab=new THREE.Mesh(new THREE.BoxGeometry(1,.7,1.1),sk);ab.position.set(0,.55,-.3);g.add(ab);
  for(let s=-1;s<=1;s+=2)for(let i=0;i<4;i++){const p=new THREE.Group();p.position.set(s*.4,.5,.55-i*.35);
   const q=new THREE.Mesh(new THREE.BoxGeometry(1,.1,.1),mat(0x2a2020));q.position.x=s*.5;p.add(q);p.rotation.z=-s*.5;g.add(p);limbs.push({p,b:0,a:.3,ph:i*1.2+(s>0?0:Math.PI),ax:'y'})}
  ly=1.6;spm=1.6}
 else{const m=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.2,1.2),new THREE.MeshLambertMaterial({color:0x6fdc5a,transparent:true,opacity:.75}));m.position.y=.6;g.add(m);
  const i=new THREE.Mesh(new THREE.BoxGeometry(.7,.7,.7),mat(0x3f9a34));i.position.y=.6;g.add(i);
  g.add(box(.2,.2,.1,0x112211,-.28,.8,.62),box(.2,.2,.1,0x112211,.28,.8,.62),box(.2,.12,.1,0x112211,0,.45,.62));
  ly=1.9;spm=.6}
 if(k!=='boss')g.add(label(fmt(v),ly));
 g.userData={v,limbs,kind:k,t:F(0,6),dir:F(0,6.28),sp:F(1.4,2.2)*spm,turn:F(1,3)};
 return g}

// 玩家手臂與槍（第一人稱）
const arm=new THREE.Group();arm.add(box(.18,.18,.7,0x4e9a3a,0,0,0),box(.1,.12,.6,0x333333,0,.14,-.5),box(.12,.2,.15,0x222222,0,-.12,-.1));
arm.position.set(.35,-.3,-.55);cam.add(arm);
const flash=new THREE.PointLight(0xffcc55,0,6);flash.position.set(.35,-.2,-1.1);cam.add(flash);

// 出題
const fmt=n=>n<0?'−'+(-n):''+n,par=n=>n<0?`(−${-n})`:''+n;
function makeQ(l){
 const u=CFG.units[R(0,CFG.units.length-1)],easy=CFG.diff==='easy',m=Math.max(5,Math.round(Math.min(8+l*3,40)*D.num)),neg=!easy||l>3;
 const N=(lo,hi)=>{const v=R(lo,hi);return neg&&R(0,2)===0?-v:v},Nn=(lo,hi)=>R(0,1)?-R(lo,hi):R(lo,hi);
 let t,r;
 if(u==='addsub'){let a=N(2,m),b=N(2,m);if(R(0,1)){r=a+b;t=`${fmt(a)} + ${par(b)}`}else{if(!neg&&a<b)[a,b]=[b,a];r=a-b;t=`${fmt(a)} − ${par(b)}`}}
 else if(u==='muldiv'){const k=Math.min(5+l,12);if(R(0,1)){const a=N(2,k),b=N(2,k);r=a*b;t=`${fmt(a)} × ${par(b)}`}else{const b=N(2,k),q=N(2,k);r=q;t=`${fmt(b*q)} ÷ ${par(b)}`}}
 else if(u==='mixed'){const a=R(2,Math.min(m,20)),b=R(2,9),c=R(2,9),f=R(0,easy?1:3);
  if(f===0){r=a+b*c;t=`${a} + ${b} × ${c}`}else if(f===1){r=(a+b)*c;t=`(${a} + ${b}) × ${c}`}
  else if(f===2){r=a*b-c;t=`${a} × ${b} − ${c}`}else{const q=R(2,12);r=q-c;t=`${q*b} ÷ ${b} − ${c}`}}
 else if(u==='abs'){const a=Nn(2,m),b=Nn(2,m),f=R(0,easy?1:2);
  if(f===0){r=Math.abs(a);t=`|${fmt(a)}|`}else if(f===1){r=Math.abs(a)+Math.abs(b);t=`|${fmt(a)}| + |${fmt(b)}|`}else{r=Math.abs(a-b);t=`|${fmt(a)} − ${par(b)}|`}}
 else{const a=Nn(2,m),b=Nn(2,m),f=R(0,easy?0:2);
  if(f===0){r=-a;t=`${fmt(a)} 的相反數`}else if(f===1){r=-a+b;t=`${fmt(a)} 的相反數 + ${par(b)}`}else{r=-(a+b);t=`−(${fmt(a)} + ${par(b)})`}}
 return{t,r:r+0,tag:u}}
const DIFF={easy:{spd:1,flank:0,cnt:0,dmg:.7,num:.7},mid:{spd:1.5,flank:.5,cnt:1,dmg:1,num:1},hard:{spd:2,flank:1,cnt:2,dmg:1.3,num:1.4}};
const UN={addsub:'整數加減',muldiv:'整數乘除',mixed:'四則運算',abs:'絕對值',opp:'相反數'},DN={easy:'易',mid:'中',hard:'難'};
let CFG={units:['addsub','muldiv','mixed','abs','opp'],diff:'mid',levels:10,bossHp:10},D=DIFF.mid,bossHp=10;
const TH_BOSS={n:'魔王巢穴',sky:0x1a0000,fog:[10,42],hue:0,sat:25,lig:14,hl:0x400000,hi:.75,deco:'nether'};
const isBoss=()=>lvl>CFG.levels;
try{$('cls').value=localStorage.getItem('mq_cls')||'';$('nm').value=localStorage.getItem('mq_nm')||''}catch(e){}
function showMenu(h,b,c){$('msg').innerHTML=h;$('go').textContent=b;$('cfg').style.display=c?'':'none';$('ov').classList.remove('hide')}
function readCfg(){const us=[...document.querySelectorAll('input[name=u]:checked')].map(e=>e.value);if(!us.length){$('msg').innerHTML='⚠ 請至少勾選一個單元';return false}
 CFG={units:us,diff:document.querySelector('input[name=d]:checked').value,levels:+$('nl').value,bossHp:+$('nb').value,cls:$('cls').value.trim(),nm:$('nm').value.trim()};D=DIFF[CFG.diff];try{localStorage.setItem('mq_cls',CFG.cls);localStorage.setItem('mq_nm',CFG.nm)}catch(e){}return true}
function setBossQ(){$('q').innerHTML='👹 恐怖玩偶魔王 <i style="display:inline-block;width:150px;height:14px;background:#0007;border:2px solid #fff;vertical-align:middle"><i style="display:block;height:100%;width:'+(100*Math.max(0,bossHp)/CFG.bossHp)+'%;background:#ff5d73"></i></i> '+Math.max(0,bossHp)+'/'+CFG.bossHp}
function hitBoss(o,p){bossHp--;p.y=2.4;pop(p,0xff5d73);fl('#ffd23f');setBossQ();if(bossHp<=0)win(o,p)}
function win(o,p){state='win';[0xffd23f,0x5be39b,0xff5d73,0x6fa8ff].forEach(c=>pop(p,c));scene.remove(o);mons=[];score+=100;hud();document.exitPointerLock&&document.exitPointerLock();
 showMenu(`<div style="border:4px double #ffd23f;padding:16px 24px;background:#000a;border-radius:6px;line-height:1.8"><div style="font-size:34px;color:#ffd23f;font-weight:800">🎉 恭喜過關！</div>${CFG.cls||CFG.nm?`<div style="font-size:26px;font-weight:700">${CFG.cls?CFG.cls+' 班　':''}${CFG.nm?CFG.nm+' 同學':''}</div>`:''}<div>擊敗「恐怖玩偶魔王」，完成全部 ${CFG.levels} 關＋魔王關</div><div>難度：${DN[CFG.diff]}　關卡數：${CFG.levels}</div><div>單元：${CFG.units.map(k=>UN[k]).join('、')}</div><div>總分：${score}　剩餘血量：${hp}/${MAXHP}</div><div style="opacity:.8;font-size:16px">${new Date().toLocaleString('zh-TW')}</div></div><div>📸 請截圖留念</div>`,'再玩一次',true)}
const MAXHP=100;let hp=100,arrows=[],lvl,score,ans,mons=[],parts=[],state='idle',yaw=0,pitch=0,keys={},cool=0,recoil=0,tracers=[];
function hud(){$('lv').textContent=isBoss()?'魔王':lvl+'/'+CFG.levels;$('sc').textContent=score;$('hp').innerHTML='❤ '+hp+'/'+MAXHP+' <i style="display:inline-block;width:110px;height:12px;background:#0007;border:2px solid #fff;vertical-align:middle"><i style="display:block;height:100%;width:'+hp+'%;background:'+(hp>40?'#5be39b':'#ff5d73')+'"></i></i>'}
const ATK={boss:{dmg:20,cd:1.4,range:2.8},zombie:{dmg:8,cd:1.2,range:1.6},skeleton:{dmg:6,cd:2.2,range:9},creeper:{dmg:30,cd:0,range:2.6},enderman:{dmg:15,cd:2.5,range:1.8},spider:{dmg:5,cd:.8,range:1.6},slime:{dmg:4,cd:1,range:1.6}};
function hurt(d,raw){if(state!=='play')return;hp=Math.max(0,hp-(raw?d:Math.round(d*D.dmg)));hud();fl('#ff3b3b');
 if(hp<=0){state='over';document.exitPointerLock&&document.exitPointerLock();showMenu(`遊戲結束<br>${isBoss()?'你被魔王擊倒了':'正確答案是 '+ans}<br>最終分數 ${score}（到第 ${isBoss()?'魔王':lvl} 關）`,'再玩一次',true)}}
function freeSpot(cx,cz,r0,r1){let x=0,z=0;for(let t=0;t<40;t++){const a=F(0,6.28),r=F(r0,r1);x=Math.max(-LIM,Math.min(LIM,cx+Math.cos(a)*r));z=Math.max(-LIM,Math.min(LIM,cz+Math.sin(a)*r));if(mons.every(o=>Math.hypot(o.position.x-x,o.position.z-z)>3.2))break}return[x,z]}
function spawnAns(){const m=mk(ans),[x,z]=freeSpot(cam.position.x,cam.position.z,18,24);m.position.set(x,0,z);m.userData.sp*=D.spd*(1+lvl*.05);m.userData.cd=2;m.userData.tp=4;m.userData.flank=Math.random()<D.flank;m.userData.slot=F(0,6.28);scene.add(m);mons.push(m)}
function kill(m){scene.remove(m);mons=mons.filter(x=>x!==m);if(m.userData.v===ans)spawnAns()}
function round(){
 mons.forEach(m=>scene.remove(m));mons=[];arrows.forEach(a=>scene.remove(a.m));arrows=[];
 if(isBoss()){buildScene(TH_BOSS);banner('⚠ 最終關・魔王登場');ans=null;bossHp=CFG.bossHp;
  const b=mk(0,'boss');b.userData.sp=1.8*D.spd;b.userData.cd=2;b.position.set(0,0,-16);scene.add(b);mons.push(b);setBossQ()}
 else{
  const th=TH[(lvl-1)%TH.length];buildScene(th);banner(`第 ${lvl}/${CFG.levels} 關・${th.n}`);const q=makeQ(lvl);ans=q.r;$('q').textContent=q.t+' = ?';
  const n=Math.min(3+Math.ceil(lvl/2)+D.cnt,9),set=new Set([ans]);
  if(CFG.diff!=='easy'&&q.tag!=='abs'&&ans!==0)set.add(-ans);
  while(set.size<n){const v=ans+R(-12,12);if(v!==ans&&(q.tag!=='abs'||v>=0))set.add(v)}
  [...set].sort(()=>Math.random()-.5).forEach(v=>{const m=mk(v);{const[x,z]=freeSpot(0,0,9,24);m.position.set(x,0,z)}m.userData.sp*=D.spd*(1+lvl*.05);m.userData.cd=F(1.5,3);m.userData.tp=F(2,5);m.userData.flank=Math.random()<D.flank;scene.add(m);mons.push(m)});
  const fk=mons.filter(m=>m.userData.flank);fk.forEach((m,i)=>m.userData.slot=i*6.283/fk.length+F(-.2,.2))}
 cam.position.set(0,1.6,0);yaw=pitch=0;hud()}
function start(){lvl=1;score=0;hp=MAXHP;state='play';hud();round();$('ov').classList.add('hide');if(!matchMedia('(pointer:coarse)').matches)cv.requestPointerLock()}
function pop(p,c){for(let i=0;i<22;i++){const m=box(.18,.18,.18,c,p.x,p.y,p.z);m.userData={v:new THREE.Vector3(F(-4,4),F(2,6),F(-4,4)),t:.9};scene.add(m);parts.push(m)}}
const ray=new THREE.Raycaster();
function shoot(){
 if(state!=='play'||cool>0)return;cool=.3;recoil=1;flash.intensity=2;
 ray.setFromCamera({x:0,y:0},cam);
 const hits=ray.intersectObjects(mons,true);
 const dir=ray.ray.direction.clone(),from=cam.localToWorld(new THREE.Vector3(.35,-.2,-1.1));
 let end=from.clone().addScaledVector(dir,60);
 if(hits.length){let o=hits[0].object;while(!o.userData.v&&o.userData.v!==0)o=o.parent;end=hits[0].point;
  const p=o.position.clone().setY(1.2);
  if(o.userData.kind==='boss'){hitBoss(o,p)}else if(o.userData.v===ans){score+=10*lvl;pop(p,0x5be39b);lvl++;hp=Math.min(MAXHP,hp+20);hud();fl('#5be39b');round()}
  else{pop(p,0xff5d73);scene.remove(o);mons=mons.filter(x=>x!==o);hurt(10,1)}}
 const geo=new THREE.BufferGeometry().setFromPoints([from,end]),ln=new THREE.Line(geo,new THREE.LineBasicMaterial({color:0xffee88}));
 ln.userData.t=.08;scene.add(ln);tracers.push(ln)}
function fl(c){const e=$('flash');e.style.background=c;e.style.opacity=.35;setTimeout(()=>e.style.opacity=0,120)}

// 輸入
addEventListener('keydown',e=>{if(/^(INPUT|SELECT)$/.test(e.target.tagName))return;const k=e.key.toLowerCase();keys[k]=true;if(k===' '){e.preventDefault();state==='play'?shoot():0}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
cv.addEventListener('mousedown',e=>{if(state==='play'){if(document.pointerLockElement===cv)shoot();else cv.requestPointerLock()}});
addEventListener('mousemove',e=>{if(document.pointerLockElement===cv){yaw-=e.movementX*.0025;pitch=Math.max(-1.2,Math.min(1.2,pitch-e.movementY*.0025))}});
document.addEventListener('pointerlockchange',()=>{if(state==='play'&&document.pointerLockElement!==cv){state='pause';showMenu('已暫停','繼續',false)}});
let tx0=null;
cv.addEventListener('touchstart',e=>{tx0=e.touches[0]},{passive:true});
cv.addEventListener('touchmove',e=>{const t=e.touches[0];if(!tx0)return;yaw-=(t.clientX-tx0.clientX)*.006;pitch=Math.max(-1.2,Math.min(1.2,pitch-(t.clientY-tx0.clientY)*.006));tx0=t},{passive:true});
document.querySelectorAll('.tc [data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',()=>keys[k]=true);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
$('tf').addEventListener('pointerdown',shoot);
$('go').onclick=()=>{if(state==='pause'){state='play';$('ov').classList.add('hide');if(!matchMedia('(pointer:coarse)').matches)cv.requestPointerLock()}else if(readCfg())start()};

let last=performance.now();
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(state==='play'){
  cool-=dt;recoil=Math.max(0,recoil-dt*8);flash.intensity=Math.max(0,flash.intensity-dt*30);
  const f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),s=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
  cam.position.x+=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*7*dt;cam.position.z+=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*7*dt;
  cam.position.x=Math.max(-LIM,Math.min(LIM,cam.position.x));cam.position.z=Math.max(-LIM,Math.min(LIM,cam.position.z));
  cam.rotation.set(pitch,yaw,0);arm.position.z=-.55+recoil*.12;arm.rotation.x=recoil*.25;
  [...mons].forEach(m=>{const u=m.userData,A=ATK[u.kind];
   const dx=cam.position.x-m.position.x,dz=cam.position.z-m.position.z,d=Math.hypot(dx,dz);
   u.dir=Math.atan2(dx,dz);u.cd-=dt;u.tp-=dt;m.rotation.y=u.dir;
   if(u.kind==='enderman'&&d>10&&u.tp<=0){const a=F(0,6.28);pop(m.position.clone().setY(1.5),0xc050ff);m.position.set(cam.position.x+Math.cos(a)*3.5,0,cam.position.z+Math.sin(a)*3.5);u.tp=6;u.cd=1}
   if(d>A.range){const sp=u.kind==='skeleton'&&d<12?0:u.sp;let tx=cam.position.x,tz=cam.position.z;if(u.flank&&d>7){tx+=Math.cos(u.slot)*6;tz+=Math.sin(u.slot)*6}const ag=Math.atan2(tx-m.position.x,tz-m.position.z);m.position.x+=Math.sin(ag)*sp*dt;m.position.z+=Math.cos(ag)*sp*dt;u.t+=dt*sp*4}
   m.position.x=Math.max(-LIM,Math.min(LIM,m.position.x));m.position.z=Math.max(-LIM,Math.min(LIM,m.position.z));
   if(u.kind==='creeper'){
    if(d<=A.range){u.fuse=(u.fuse||0)+dt;m.scale.setScalar(1+Math.sin(u.fuse*25)*.08+u.fuse*.25);
     if(u.fuse>1){pop(m.position.clone().setY(1.2),0xffa030);pop(m.position.clone().setY(1.2),0x888888);if(d<4)hurt(A.dmg);kill(m);return}}
    else{u.fuse=0;m.scale.setScalar(1)}}
   else if(u.kind==='skeleton'){
    if(d<18&&u.cd<=0){u.cd=A.cd;const a=box(.08,.08,.7,0xdddddd,m.position.x,1.4,m.position.z);
     const v=new THREE.Vector3(cam.position.x-m.position.x,cam.position.y-1.4-.2,cam.position.z-m.position.z).normalize();a.lookAt(a.position.clone().add(v));scene.add(a);arrows.push({m:a,v:v.multiplyScalar(16),t:3})}}
   else if(u.kind==='boss'){
    if(d>A.range&&d<22&&u.cd<=0){u.cd=2.4*1.5/D.spd;const a=box(.1,.1,.9,0xdddddd,m.position.x,2.2,m.position.z);const v=new THREE.Vector3(cam.position.x-m.position.x,cam.position.y-2.2,cam.position.z-m.position.z).normalize();a.lookAt(a.position.clone().add(v));scene.add(a);arrows.push({m:a,v:v.multiplyScalar(15),t:3,dmg:12})}
    else if(d<=A.range&&u.cd<=0){hurt(A.dmg);u.cd=A.cd}}
   else if(d<=A.range&&u.cd<=0){hurt(A.dmg);u.cd=A.cd}
   u.limbs.forEach(l=>{l.p.rotation[l.ax]=l.b+Math.sin(u.t+l.ph)*l.a});
   if(u.kind==='slime'){const b=Math.abs(Math.sin(u.t*.5));m.position.y=b*.6;m.scale.set(1+(1-b)*.1,.85+b*.3,1+(1-b)*.1)}});
  for(let i=0;i<mons.length;i++)for(let j=i+1;j<mons.length;j++){const a=mons[i].position,b=mons[j].position;let dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);
   if(d<2.3){if(d<.01){dx=F(-1,1);dz=F(-1,1);d=Math.hypot(dx,dz)||1}const o=(2.3-d)/2/d;a.x-=dx*o;a.z-=dz*o;b.x+=dx*o;b.z+=dz*o}}
  mons.forEach(m=>{m.position.x=Math.max(-LIM,Math.min(LIM,m.position.x));m.position.z=Math.max(-LIM,Math.min(LIM,m.position.z))});
 }
 arrows.forEach(a=>{a.t-=dt;a.m.position.addScaledVector(a.v,dt);if(state==='play'&&a.m.position.distanceTo(cam.position)<.9){hurt(a.dmg||ATK.skeleton.dmg);a.t=0}if(a.t<=0)scene.remove(a.m)});arrows=arrows.filter(a=>a.t>0);
 parts.forEach(p=>{p.userData.t-=dt;p.userData.v.y-=14*dt;p.position.addScaledVector(p.userData.v,dt);if(p.userData.t<=0||p.position.y<0)scene.remove(p)});parts=parts.filter(p=>p.userData.t>0&&p.position.y>=0);
 tracers.forEach(t=>{t.userData.t-=dt;if(t.userData.t<=0)scene.remove(t)});tracers=tracers.filter(t=>t.userData.t>0);
 ren.render(scene,cam);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
